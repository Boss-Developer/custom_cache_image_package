name: custom_cached_image
description: A Flutter package for displaying cached network images with a shimmer loading effect.
version: 1.10.0

homepage: https://github.com/Boss-Developer/custom_cache_image_package
repository: https://github.com/Boss-Developer/custom_cache_image_package
issue_tracker: https://github.com/Boss-Developer/custom_cache_image_package/issues

platforms:
  android:
  ios:
  web:
  windows:
  linux:
  macos:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.5
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  # Assets section if you have any assets (e.g., images or GIFs) that your package requires.
  assets:
    - assets/upload.gif
    - assets/namePic.png
    - assets/simplePic.png

# Fonts section for any custom fonts, if needed.
